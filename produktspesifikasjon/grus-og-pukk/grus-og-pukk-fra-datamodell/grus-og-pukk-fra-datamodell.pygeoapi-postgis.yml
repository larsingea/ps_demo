# pygeoapi-konfigurasjon — generert fra datamodellen og metadata i Geonorge.
# Verdier merket "<REPLACE_ME>" må fylles inn før tjenesten kan startes.
server:
  bind:
    host: 0.0.0.0
    port: 5000
  cors: false
  url: ${PYGEOAPI_SERVER_URL:-http://localhost:5000}
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  gzip: false
  languages:
  - nb-NO
  pretty_print: true
  admin: ${PYGEOAPI_SERVER_ADMIN:-false}
  limits:
    default_items: 20
    max_items: 100
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap
      contributors</a>'
logging:
  level: ERROR
metadata:
  identification:
    title: Grus og pukk
    description: Grus- og Pukkdatabasen ved NGU inneholder opplysninger om de aller
      fleste grus- og pukkforekomster og uttakssteder i Norge for utnyttelse som råstoff
      for bygge- og anleggsvirksomhet. Databasen gir også informasjon om arealbruk,
      volum, kvalitet og hvor viktige ressursene er som råstoff til byggetekniske
      formål.
    keywords:
    - Byggeråstoffer
    - Geologi
    - Grus
    - Løsmasser
    - Pukk
    - Ressurs
    - Sand
    - Steinindustri
    - Mineralressurser
    - Inspire
    - Det offentlige kartgrunnlaget
    - Norge digitalt
    - geodataloven
    - dataNorgeNo
    - modellbaserteVegprosjekter
    - fellesDatakatalog
    keywords_type: theme
    terms_of_service: Åpne data
    url: https://kartkatalog.geonorge.no/metadata/a26e57bc-15bd-46db-8504-6c6ed1e7c501
  license:
    name: Norsk lisens for offentlige data (NLOD)
    url: http://data.norge.no/nlod/no/1.0
  provider:
    name: Norges geologiske undersøkelse
    url: "<REPLACE_ME>"
  contact:
    name: Norges geologiske undersøkelse
    email: metadataansvarlig@ngu.no
    url: "<REPLACE_ME>"
